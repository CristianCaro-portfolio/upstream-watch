[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "upstream-watch"
version = "0.1.0"
description = "Upstream river gauges as early warning for the places downstream, for the Potomac (USGS) and the Cauca in Colombia (IDEAM): a gauge knowledge graph, crest travel times and a LangGraph agent that answers with citations"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Cristian Caro" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2.12,<1.3",
    "real_ladybug>=0.15,<0.16",
    "qdrant-client>=1.20,<2",
    "fastembed>=0.9,<0.10",
    "polars>=2.1,<3",
    "httpx>=0.28",
    "pydantic>=2.10",
    "mcp>=2.3,<3",
    "opentelemetry-sdk>=1.45",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
local-llm = ["torch>=2.5", "transformers>=4.50"]
colombia = ["pyshp>=2.3", "shapely>=2.0"]

[project.scripts]
upstream-watch = "upstream_watch.cli:app"

[tool.setuptools]
packages = ["upstream_watch"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"upstream_watch/evaluate.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
